<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle deník</title>
  <meta name="description" content="Osobní seznam krátkých doodle tutoriálů: co je hotové, co je na řadě.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131824" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#zbyva-nadpis">Přeskočit na seznam videí</a>

  <div class="page">
    <div class="notices" id="notices" aria-live="polite"></div>

    <header class="masthead">
      <div class="masthead-top">
        <h1>Doodle deník</h1>
        <button type="button" class="pill pill-quiet" id="login-top" data-action="login" hidden>Přihlásit se</button>
      </div>
      <p class="progress" id="progress">
        <span class="progress-count" id="progress-count">… / …</span>
        <span class="progress-pct" id="progress-pct" hidden></span>
      </p>
      <div class="mosaic" id="mosaic" role="group" aria-label="Mozaika videí. Šipkami vybereš kolečko, Enterem přejdeš na video v seznamu."></div>
    </header>

    <main id="main">
      <section class="card next-card" id="next-card" aria-labelledby="next-nadpis">
        <h2 class="card-heading" id="next-nadpis">Na řadě</h2>
        <div class="next-body" id="next-body">
          <p class="muted">Načítám…</p>
        </div>
      </section>

      <section class="player" id="player" aria-label="Přehrávač" hidden>
        <div class="player-frame">
          <div id="yt-player"></div>
          <div class="player-message" id="player-message" hidden>
            <p id="player-message-text"></p>
            <a class="pill" id="player-message-link" href="#" target="_blank" rel="noopener">Otevřít na YouTube</a>
          </div>
        </div>
        <div class="player-bar">
          <p class="player-title" id="player-title"></p>
          <div class="player-actions">
            <button type="button" class="pill" id="player-done" data-action="player-done" aria-pressed="false" hidden>Hotovo</button>
            <a class="pill pill-quiet" id="player-yt" href="#" target="_blank" rel="noopener">Otevřít na YouTube</a>
            <button type="button" class="icon-btn player-close" id="player-close" data-action="player-close" aria-label="Zavřít přehrávač">×</button>
          </div>
        </div>
      </section>

      <section class="list-section" aria-labelledby="zbyva-nadpis">
        <h2 class="list-heading" id="zbyva-nadpis" tabindex="-1">Zbývá <span class="count" id="remaining-count"></span></h2>
        <p class="list-hint" id="remaining-hint" hidden></p>
        <ol class="rows" id="list-remaining"></ol>
        <p class="empty" id="remaining-empty" hidden>Všechno hotovo. Krásná práce!</p>
      </section>

      <section class="list-section" id="done-section" aria-labelledby="hotova-nadpis" hidden>
        <h2 class="list-heading" id="hotova-nadpis">Hotová <span class="count" id="done-count"></span></h2>
        <ol class="rows" id="list-done"></ol>
        <p class="empty" id="done-empty" hidden>Zatím nic. První odškrtnuté video se objeví tady.</p>
      </section>
    </main>

    <footer class="footer">
      <section class="account" aria-labelledby="ucet-nadpis">
        <h2 class="account-heading" id="ucet-nadpis">Účet</h2>
        <div id="account-body">
          <p class="muted">Načítám…</p>
        </div>
      </section>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>

  <noscript>
    <p class="noscript">Doodle deník potřebuje zapnutý JavaScript.</p>
  </noscript>
</body>
</html>
