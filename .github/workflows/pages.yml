name: Aktualizace a nasazení

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 5 * * *" # denně kolem 5:00 UTC
  workflow_dispatch:

permissions:
  contents: write # commit aktualizovaného data/videos.json a nových náhledů
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Jen informace, jestli je secret nastavený; samotný klíč dostane jen krok se skriptem.
      HAS_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Načtení playlistu z YouTube
        id: playlist
        if: env.HAS_YOUTUBE_API_KEY == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update_playlist.py

      - name: Bez YouTube API klíče
        if: env.HAS_YOUTUBE_API_KEY != 'true'
        run: echo "Secret YOUTUBE_API_KEY není nastavený, seznam videí se neaktualizuje."

      - name: Python pro náhledy
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Vyrobí chybějící thumbs/<id>.jpg, existující nechá být. Když se některý
      # náhled nepodaří stáhnout, krok skončí chybou, ale nasazení pokračuje;
      # stránka místo chybějícího náhledu ukáže šedý čtverec.
      - name: Náhledy videí
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/make_thumbs.py

      - name: Commit změněného seznamu videí a nových náhledů
        run: |
          git add --all -- data/videos.json thumbs
          if git diff --cached --quiet; then
            echo "Seznam videí ani náhledy se nezměnily."
            exit 0
          fi
          if git diff --cached --quiet -- data/videos.json; then
            message="Nové náhledy videí"
          else
            message="Aktualizace seznamu videí z playlistu"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${message}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Příprava souborů webu
        run: |
          mkdir -p _site
          cp index.html style.css app.js firebase-config.js _site/
          cp -r data thumbs _site/

      - name: Nastavení Pages
        uses: actions/configure-pages@v6

      - name: Nahrání webu
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
